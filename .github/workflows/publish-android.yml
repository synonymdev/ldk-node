name: Android Publish

env:
  NDK_RELEASE: r28b
  NDK_VERSION: 28.1.13356709

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to publish (e.g., v0.7.0-rc.50 or 0.7.0-rc.50)"
        required: true
      dry_run:
        description: "Build and upload CI artifacts without publishing"
        type: boolean
        required: false
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Normalize release version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name || github.ref_name }}
      run: |
        if [[ ! "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid release version/tag" >&2
          exit 1
        fi
        TAG="$INPUT_VERSION"
        if [[ "$TAG" != v* ]]; then
          TAG="v$TAG"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
        echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.version.outputs.tag }}
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config protobuf-compiler

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ env.NDK_RELEASE }}
        add-to-path: true

    - name: Verify and export Android NDK environment
      env:
        INSTALLED_NDK_VERSION: ${{ steps.setup-ndk.outputs.ndk-full-version }}
      run: |
        test "$INSTALLED_NDK_VERSION" = "$NDK_VERSION"
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Generate Android bindings
      run: scripts/uniffi_bindgen_generate_kotlin_android.sh

    - name: Build with Gradle
      working-directory: bindings/kotlin/ldk-node-android
      run: ./gradlew build "-Pversion=$RELEASE_VERSION"

    - name: Upload native debug symbols artifact
      uses: actions/upload-artifact@v4
      with:
        name: ldk-node-native-debug-symbols-${{ steps.version.outputs.version }}
        path: bindings/kotlin/ldk-node-android/native-debug-symbols.zip

    - name: Upload native debug symbols to release
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$RELEASE_TAG" bindings/kotlin/ldk-node-android/native-debug-symbols.zip --clobber

    - name: Publish to GitHub Packages
      if: ${{ !inputs.dry_run }}
      working-directory: bindings/kotlin/ldk-node-android
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPO: ${{ github.repository }}
      run: ./gradlew publish "-Pversion=$RELEASE_VERSION"
