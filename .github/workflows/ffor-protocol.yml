name: FFOR protocol primitives

on:
  pull_request:
    paths:
      - 'crates/ffor-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ffor-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p ffor-protocol -- --check
      - run: cargo test -p ffor-protocol --locked
      - run: cargo clippy -p ffor-protocol --all-targets --locked -- -D warnings

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/ffor-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python3 fuzz/seed_corpus.py
      - run: cargo fuzz run wire -- -max_len=131072 -max_total_time=30
