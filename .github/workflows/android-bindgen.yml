name: Android Bindgen

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/android-bindgen.yml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/bindings/android/**'
      - '**/bindings/kotlin/**'
      - '**/build*.sh'
      - '**/build.rs'
      - '**/*.gradle*'
      - '**/*.rs'
      - '**/*.udl'
      - '**/gradle/**'
      - '**/gradle.properties'
      - '**/gradlew*'
      - '**/settings.gradle*'
      - '**/uniffi*.toml'
      - 'bindgen.sh'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/android-bindgen.yml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/bindings/android/**'
      - '**/bindings/kotlin/**'
      - '**/build*.sh'
      - '**/build.rs'
      - '**/*.gradle*'
      - '**/*.rs'
      - '**/*.udl'
      - '**/gradle/**'
      - '**/gradle.properties'
      - '**/gradlew*'
      - '**/settings.gradle*'
      - '**/uniffi*.toml'
      - 'bindgen.sh'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-bindgen:
    name: Android Bindgen
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler zip unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: true

      - name: Export Android NDK paths
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Generate Android bindings and artifacts
        run: ./scripts/uniffi_bindgen_generate_kotlin_android.sh

      - name: Verify Android outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            bindings/kotlin/ldk-node-android/lib/src/main/kotlin/org/lightningdevkit/ldknode/ldk_node.android.kt
            bindings/kotlin/ldk-node-android/lib/src/main/kotlin/org/lightningdevkit/ldknode/ldk_node.common.kt
            bindings/kotlin/ldk-node-android/lib/src/main/jniLibs/armeabi-v7a/libldk_node.so
            bindings/kotlin/ldk-node-android/lib/src/main/jniLibs/arm64-v8a/libldk_node.so
            bindings/kotlin/ldk-node-android/lib/src/main/jniLibs/x86_64/libldk_node.so
            bindings/kotlin/ldk-node-android/native-debug-symbols.zip
          )

          for path in "${required[@]}"; do
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty generated Android output: $path"
              exit 1
            fi
          done

          aar_count=$(find bindings/kotlin/ldk-node-android/lib/build/outputs/aar -name '*release.aar' -type f | wc -l | tr -d ' ')
          if [ "$aar_count" -eq 0 ]; then
            echo "::error::Missing generated Android release AAR"
            exit 1
          fi

          zip -T bindings/kotlin/ldk-node-android/native-debug-symbols.zip >/dev/null

      - name: Upload Android generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: ldk-node-android-bindgen
          path: |
            bindings/kotlin/ldk-node-android/lib/src/main/kotlin/org/lightningdevkit/ldknode/*.kt
            bindings/kotlin/ldk-node-android/lib/src/main/jniLibs/**/libldk_node.so
            bindings/kotlin/ldk-node-android/native-debug-symbols.zip
            bindings/kotlin/ldk-node-android/lib/build/outputs/aar/*release.aar
          if-no-files-found: error
