name: iOS Bindgen

on:
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/ios-bindgen.yml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/Package.swift'
      - '**/bindings/ios/**'
      - '**/bindings/swift/**'
      - '**/build*.sh'
      - '**/build.rs'
      - '**/*.rs'
      - '**/*.udl'
      - '**/uniffi*.toml'
      - 'bindgen.sh'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/ios-bindgen.yml'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/Package.swift'
      - '**/bindings/ios/**'
      - '**/bindings/swift/**'
      - '**/build*.sh'
      - '**/build.rs'
      - '**/*.rs'
      - '**/*.udl'
      - '**/uniffi*.toml'
      - 'bindgen.sh'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-bindgen:
    name: iOS Bindgen
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Validate root SwiftPM manifest
        env:
          CLANG_MODULE_CACHE_PATH: .build/module-cache
        run: swift package dump-package >/dev/null

      - name: Validate local SwiftPM manifest
        working-directory: bindings/swift
        env:
          CLANG_MODULE_CACHE_PATH: .build/module-cache
        run: swift package dump-package >/dev/null

      - name: Generate Swift bindings and XCFramework
        run: |
          ./scripts/uniffi_bindgen_generate_swift.sh
          ./scripts/swift_create_xcframework_archive.sh

      - name: Verify iOS outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            bindings/swift/Sources/LDKNode/LDKNode.swift
            bindings/swift/LDKNodeFFI.xcframework
            dist/ios/LDKNodeFFI.xcframework.zip
          )

          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing generated iOS output: $path"
              exit 1
            fi
          done

          test -s dist/ios/LDKNodeFFI.xcframework.zip
          swift package compute-checksum dist/ios/LDKNodeFFI.xcframework.zip

      - name: Check committed iOS interface files
        shell: bash
        run: |
          set -euo pipefail
          generated_sources=(
            bindings/swift/Sources/LDKNode/LDKNode.swift
          )

          if ! git diff --quiet -- "${generated_sources[@]}"; then
            echo "::error::Committed iOS interface files are stale. Run './scripts/uniffi_bindgen_generate_swift.sh', restore Package.swift unless preparing a release, and commit the updated interface files."
            git diff --name-only -- "${generated_sources[@]}"
            exit 1
          fi

      - name: Upload iOS generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: ldk-node-ios-bindgen
          path: |
            bindings/swift/Sources/LDKNode/LDKNode.swift
            bindings/swift/LDKNodeFFI.xcframework
            dist/ios/LDKNodeFFI.xcframework.zip
          if-no-files-found: error
