name: Bindgen Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Scripts, Cargo, and Android manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check shell scripts
        run: |
          bash -n bindgen.sh
          bash -n scripts/*.sh

      - name: Check Cargo manifest
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Gradle project
        working-directory: bindings/kotlin/ldk-node-android
        run: ./gradlew projects --no-daemon

      - name: Check JVM Gradle project
        working-directory: bindings/kotlin/ldk-node-jvm
        run: ./gradlew projects --no-daemon

      - name: Check Python package metadata
        run: python3 -c 'from pathlib import Path; data = Path("bindings/python/pyproject.toml").read_text(); assert "[project]" in data and "name = \"ldk_node\"" in data'

  swift-manifest:
    name: SwiftPM manifest
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check root SwiftPM manifest
        env:
          CLANG_MODULE_CACHE_PATH: .build/module-cache
        run: swift package dump-package >/dev/null

      - name: Check local SwiftPM manifest
        working-directory: bindings/swift
        env:
          CLANG_MODULE_CACHE_PATH: .build/module-cache
        run: swift package dump-package >/dev/null
